<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05050b">
<title>Transaksi — NexusBase</title>
<style>

.page-head{
  margin-bottom:22px;
}

.page-desc{
  margin:6px 0 0;
  color:var(--muted);
  font-size:12px;
}

.trx-filter-card{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.search-box{
  position:relative;
}

.search-box span{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  font-size:18px;
  color:var(--muted);
}

.search-box input{
  width:100%;
  height:46px;
  border:1px solid var(--line2);
  border-radius:13px;
  background:rgba(0,0,0,.18);
  color:var(--text);
  font:inherit;
  padding:0 14px 0 40px;
  outline:none;
}

.search-box input::placeholder{
  color:#6f6a8c;
}

.search-box input:focus{
  border-color:rgba(109,67,240,.6);
  box-shadow:0 0 22px -15px var(--violet-hi);
}

.filter-group{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.filter-label{
  padding-left:2px;
  color:rgba(151,147,182,.7);
  font-size:9px;
  font-weight:700;
  letter-spacing:.12em;
}

.filter-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.filter-chip{
  padding:9px 16px;
  border:1px solid var(--line2);
  border-radius:999px;
  background:rgba(255,255,255,.02);
  color:var(--muted);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.04em;
  white-space:nowrap;
  transition:color .15s,border-color .15s,background .15s,box-shadow .15s;
}

.filter-chip:hover{
  color:var(--text);
  border-color:rgba(164,139,255,.35);
}

.filter-chip.active{
  color:#fff;
  border-color:transparent;
  background:linear-gradient(110deg,var(--crimson),var(--violet));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    0 12px 26px -16px var(--crimson-hi),
    0 0 18px -10px var(--violet);
}

.trx-list{
  padding:6px;
  overflow:hidden;
}

.trx-item{
  display:flex;
  align-items:center;
  width:100%;
  gap:14px;
  padding:14px 14px;
  border:0;
  border-bottom:1px solid var(--line);
  border-radius:12px;
  background:transparent;
  color:inherit;
  text-align:left;
  cursor:pointer;
  transition:background .15s;
}

.trx-item:last-child{
  border-bottom:0;
}

.trx-item:hover{
  background:rgba(255,255,255,.03);
}

.trx-icon{
  width:44px;
  height:44px;
  border-radius:14px;
  display:grid;
  place-items:center;
  flex:none;
}

.trx-icon svg{
  width:22px;
  height:22px;
}

.trx-icon.in{
  background:rgba(109,67,240,.14);
  border:1px solid rgba(164,139,255,.28);
  box-shadow:0 0 18px -8px var(--violet);
}

.trx-icon.in svg{
  color:var(--violet-hi);
}

.trx-icon.out{
  background:rgba(212,20,47,.12);
  border:1px solid rgba(240,37,63,.28);
  box-shadow:0 0 18px -8px var(--crimson-hi);
}

.trx-icon.out svg{
  color:var(--crimson-hi);
}

.trx-info{
  flex:1;
  min-width:0;
}

.trx-name{
  display:block;
  font-weight:700;
  font-size:12.5px;
}

.trx-detail{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:10.5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.trx-meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:7px;
  margin-top:6px;
  color:rgba(151,147,182,.65);
  font-size:9.5px;
}

.trx-meta .dot{
  width:3px;
  height:3px;
  border-radius:50%;
  background:currentColor;
  flex:none;
}

.trx-right{
  display:flex;
  flex:none;
  flex-direction:column;
  align-items:flex-end;
  gap:7px;
}

.trx-amount{
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}

.trx-amount.plus{
  color:#22d3c5;
}

.trx-amount.minus{
  color:var(--text);
}

.empty-state{
  padding:52px 20px;
  text-align:center;
}

.empty-state-icon{
  width:58px;
  height:58px;
  margin:0 auto 16px;
  display:grid;
  place-items:center;
  border-radius:50%;
  border:1px solid rgba(164,139,255,.3);
  background:rgba(109,67,240,.08);
  box-shadow:0 0 26px -10px var(--violet);
  color:var(--violet-hi);
}

.empty-state-icon svg{
  width:26px;
  height:26px;
}

.empty-state h2{
  margin:0 0 8px;
  font-size:14px;
}

.empty-state p{
  margin:0;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}

.modal{
  position:fixed;
  inset:0;
  z-index:80;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(2,2,6,.78);
  backdrop-filter:blur(5px);
}

.modal.show{
  display:flex;
}

.detail-card{
  width:min(420px,100%);
  padding:26px;
  border:1px solid transparent;
  border-radius:20px;
  background:
    linear-gradient(160deg,#151126,#090912) padding-box,
    var(--edge) border-box;
  box-shadow:
    0 30px 80px -25px #000,
    0 0 50px -18px var(--violet);
}

.detail-head{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
}

.detail-head h3{
  margin:0;
  font-size:14px;
}

.detail-head small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
}

.detail-rows{
  border-top:1px solid var(--line);
}

.detail-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:12px 2px;
  border-bottom:1px solid var(--line);
}

.detail-row span{
  color:var(--muted);
  font-size:10px;
}

.detail-row b{
  font-size:11.5px;
  font-weight:700;
  text-align:right;
}

.detail-extra{
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid var(--line);
}

.detail-extra-label{
  display:block;
  margin-bottom:6px;
  color:rgba(151,147,182,.7);
  font-size:9px;
  font-weight:700;
  letter-spacing:.12em;
}

.detail-extra p{
  margin:0;
  color:var(--muted);
  font-size:10.5px;
  line-height:1.7;
}

.detail-close{
  width:100%;
  margin-top:20px;
  text-align:center;
}

@media(max-width:600px){
  .trx-item{
    padding:13px 10px;
    gap:11px;
  }
  .trx-icon{
    width:38px;
    height:38px;
    border-radius:12px;
  }
  .trx-icon svg{
    width:19px;
    height:19px;
  }
  .filter-chip{
    padding:8px 13px;
    font-size:10px;
  }
  .detail-card{
    padding:22px;
  }
}

</style>
</head>
<body>
<div id="nexusControls"></div>
<div id="nexusIcons"></div>
<div id="nexusHeader"></div>
<div id="nexusSidebar"></div>
<div id="nexusScrim"></div>
<main>

<div class="page-head">
<h1>TRANSAKSI</h1>
<p class="page-desc">Riwayat aktivitas transaksi anda</p>
</div>

<section>
<div class="card trx-filter-card">

<div class="search-box">
<span>⌕</span>
<input id="trxSearch" type="search" placeholder="Cari transaksi" autocomplete="off">
</div>

<div class="filter-group">
<span class="filter-label">KATEGORI</span>
<div class="filter-row" id="categoryFilter">
<button type="button" class="filter-chip active" data-category="semua">Semua</button>
<button type="button" class="filter-chip" data-category="deposit">Deposit</button>
<button type="button" class="filter-chip" data-category="sosmed">Suntik Sosmed</button>
<button type="button" class="filter-chip" data-category="nokos">Nokos</button>
<button type="button" class="filter-chip" data-category="saldo">Saldo</button>
</div>
</div>

<div class="filter-group">
<span class="filter-label">STATUS</span>
<div class="filter-row" id="statusFilter">
<button type="button" class="filter-chip active" data-status="semua">Semua</button>
<button type="button" class="filter-chip" data-status="berhasil">Berhasil</button>
<button type="button" class="filter-chip" data-status="pending">Pending</button>
<button type="button" class="filter-chip" data-status="dibatalkan">Dibatalkan</button>
</div>
</div>

</div>
</section>

<section>
<div class="card trx-list" id="trxList"></div>
</section>

</main>

<div class="modal" id="detailModal">
<div class="detail-card">

<div class="detail-head">
<span class="trx-icon" id="detailIcon"></span>
<div>
<h3>Detail Transaksi</h3>
<small id="detailSub"></small>
</div>
</div>

<div class="detail-rows" id="detailRows"></div>

<div class="detail-extra">
<span class="detail-extra-label">DETAIL TAMBAHAN</span>
<p id="detailExtra"></p>
</div>

<button type="button" class="btn ghost detail-close" id="closeDetail">TUTUP</button>

</div>
</div>

<script>
const DESIGN_SOURCE="desain.html";

function insertTemplate(id,html){
  const mount=document.getElementById(id);
  if(!mount)return;
  mount.outerHTML=html||"";
}

async function loadNexusDesign(){
  const response=await fetch(DESIGN_SOURCE,{cache:"no-store"});
  if(!response.ok)throw new Error("Gagal memuat desain.html");
  const source=await response.text();
  const doc=new DOMParser().parseFromString(source,"text/html");

  doc.querySelectorAll("link[rel='stylesheet'],link[href*='fonts.googleapis.com']").forEach(link=>{
    const clone=document.createElement("link");
    clone.rel=link.rel;
    clone.href=link.href;
    document.head.appendChild(clone);
  });

  doc.querySelectorAll("style").forEach(style=>{
    const clone=document.createElement("style");
    clone.textContent=style.textContent;
    document.head.appendChild(clone);
  });

  const templates={};
  doc.querySelectorAll("template").forEach(template=>templates[template.id]=template.innerHTML);

  insertTemplate("nexusControls",templates["nexus-controls"]);
  insertTemplate("nexusIcons",templates["nexus-icons"]);
  insertTemplate("nexusHeader",templates["nexus-header"]);
  insertTemplate("nexusSidebar",templates["nexus-sidebar"]);
  insertTemplate("nexusScrim",templates["nexus-scrim"]);

  const active=document.querySelector('.nav[data-n="TRANSAKSI"]');
  if(active)active.classList.add("active");

  initTransaksi();
}

function initTransaksi(){
  const navToggle=document.getElementById("navToggle");
  const scrim=document.querySelector(".scrim");
  if(scrim) scrim.addEventListener("click",()=>{navToggle.checked=false});

  const backButton=document.getElementById("backButton");
  if(backButton) backButton.addEventListener("click",()=>{
    navToggle.checked=false;
    if(window.history.length>1){window.history.back();return}
    window.location.href="dashboard.html";
  });

  document.querySelectorAll("aside a").forEach(link=>link.addEventListener("click",()=>{
    if(window.innerWidth<=900)navToggle.checked=false;
  }));

  initTransaksiPage();
}

function initTransaksiPage(){
  const transactions=[];

  const statusLabel={berhasil:"Berhasil",pending:"Pending",dibatalkan:"Dibatalkan"};
  const statusTag={berhasil:"ok",pending:"wait",dibatalkan:"fail"};

  const listEl=document.getElementById("trxList");
  const searchInput=document.getElementById("trxSearch");
  const categoryButtons=[...document.querySelectorAll("#categoryFilter .filter-chip")];
  const statusButtons=[...document.querySelectorAll("#statusFilter .filter-chip")];
  const modal=document.getElementById("detailModal");
  const closeDetail=document.getElementById("closeDetail");

  let activeCategory="semua";
  let activeStatus="semua";

  function money(value){
    return "Rp"+Number(value).toLocaleString("id-ID");
  }

  function formatDate(iso){
    const date=new Date(iso);
    const tanggal=date.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
    const jam=date.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
    return tanggal+" · "+jam;
  }

  function emptyMarkup(){
    return `
      <div class="empty-state">
        <div class="empty-state-icon"><svg><use href="#i-trx"/></svg></div>
        <h2>Belum ada transaksi</h2>
        <p>Riwayat transaksi anda akan muncul<br>di sini setelah ada aktivitas</p>
      </div>
    `;
  }

  function render(){
    const query=searchInput.value.trim().toLowerCase();

    const filtered=transactions.filter(trx=>{
      const matchCategory=activeCategory==="semua"||trx.category===activeCategory;
      const matchStatus=activeStatus==="semua"||trx.status===activeStatus;
      const haystack=(trx.name+" "+trx.detail+" "+trx.id).toLowerCase();
      const matchQuery=!query||haystack.includes(query);
      return matchCategory&&matchStatus&&matchQuery;
    });

    if(!filtered.length){
      listEl.innerHTML=emptyMarkup();
      return;
    }

    listEl.innerHTML=filtered.map(trx=>`
      <button type="button" class="trx-item" data-id="${trx.id}">
        <span class="trx-icon ${trx.direction}">
          <svg><use href="#${trx.icon}"/></svg>
        </span>
        <span class="trx-info">
          <span class="trx-name">${trx.name}</span>
          <span class="trx-detail">${trx.detail}</span>
          <span class="trx-meta">
            <span>${formatDate(trx.date)}</span>
            <span class="dot"></span>
            <span>${trx.id}</span>
          </span>
        </span>
        <span class="trx-right">
          <span class="trx-amount ${trx.direction==='in'?'plus':'minus'}">${trx.direction==='in'?'+':'-'}${money(trx.amount)}</span>
          <span class="tag ${statusTag[trx.status]}">${statusLabel[trx.status]}</span>
        </span>
      </button>
    `).join("");

    listEl.querySelectorAll("[data-id]").forEach(item=>{
      item.addEventListener("click",()=>openDetail(item.dataset.id));
    });
  }

  function openDetail(id){
    const trx=transactions.find(item=>item.id===id);
    if(!trx)return;

    const iconEl=document.getElementById("detailIcon");
    iconEl.className="trx-icon "+trx.direction;
    iconEl.innerHTML=`<svg><use href="#${trx.icon}"/></svg>`;

    document.getElementById("detailSub").textContent=trx.name+" · "+trx.detail;

    document.getElementById("detailRows").innerHTML=`
      <div class="detail-row"><span>ID Transaksi</span><b>${trx.id}</b></div>
      <div class="detail-row"><span>Jenis</span><b>${trx.name}</b></div>
      <div class="detail-row"><span>Nominal</span><b>${money(trx.amount)}</b></div>
      <div class="detail-row"><span>Status</span><b>${statusLabel[trx.status]}</b></div>
      <div class="detail-row"><span>Tanggal</span><b>${formatDate(trx.date)}</b></div>
    `;

    document.getElementById("detailExtra").textContent=trx.extra;

    modal.classList.add("show");
  }

  function closeDetailModal(){
    modal.classList.remove("show");
  }

  closeDetail.addEventListener("click",closeDetailModal);
  modal.addEventListener("click",event=>{
    if(event.target===modal)closeDetailModal();
  });

  categoryButtons.forEach(button=>{
    button.addEventListener("click",()=>{
      activeCategory=button.dataset.category;
      categoryButtons.forEach(b=>b.classList.toggle("active",b===button));
      render();
    });
  });

  statusButtons.forEach(button=>{
    button.addEventListener("click",()=>{
      activeStatus=button.dataset.status;
      statusButtons.forEach(b=>b.classList.toggle("active",b===button));
      render();
    });
  });

  searchInput.addEventListener("input",render);

  render();
}

loadNexusDesign().catch(()=>{
  document.body.innerHTML='<main style="padding:40px"><div class="card"><h2>Desain gagal dimuat</h2><p class="muted">Pastikan desain.html berada di folder yang sama dengan transaksi.html</p></div></main>';
});
</script>
</body>
</html>
