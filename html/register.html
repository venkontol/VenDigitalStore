<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070d">
  <meta
    name="description"
    content="Daftar akun VenDigitalStore"
  >
  <title>Daftar — VenDigitalStore</title>

  <link
    rel="stylesheet"
    href="/CSS/base.css"
  >
  <link
    rel="stylesheet"
    href="/CSS/components.css"
  >
  <link
    rel="stylesheet"
    href="/CSS/login.css"
  >
</head>

<body class="auth-body">
  <main class="auth-page">
    <div class="auth-background"></div>

    <section
      class="auth-container"
      aria-labelledby="register-title"
    >
      <div class="auth-brand">
        <a
          class="brand-logo"
          href="/"
          aria-label="VenDigitalStore"
        >
          <span class="brand-mark">VD</span>
          <span>VenDigitalStore</span>
        </a>
      </div>

      <div class="auth-card">
        <div class="auth-header">
          <span class="auth-eyebrow">
            ACCOUNT
          </span>

          <h1 id="register-title">
            Buat akun
          </h1>

          <p>
            Daftar untuk mulai menggunakan
            layanan VenDigitalStore.
          </p>
        </div>

        <div
          id="registerAlert"
          class="alert"
          role="alert"
          aria-live="polite"
        ></div>

        <form
          id="registerForm"
          class="auth-form"
          method="post"
          action="/api/auth/register"
        >
          <div class="form-group">
            <label
              for="firstName"
            >
              Nama depan
            </label>

            <input
              id="firstName"
              class="input"
              type="text"
              name="first_name"
              autocomplete="given-name"
              maxlength="80"
              required
            >
          </div>

          <div class="form-group">
            <label
              for="username"
            >
              Username
            </label>

            <input
              id="username"
              class="input"
              type="text"
              name="username"
              autocomplete="username"
              maxlength="32"
              required
            >
          </div>

          <div class="form-group">
            <label
              for="password"
            >
              Password
            </label>

            <input
              id="password"
              class="input"
              type="password"
              name="password"
              autocomplete="new-password"
              required
            >
          </div>

          <button
            id="registerButton"
            class="btn btn-primary auth-submit"
            type="submit"
          >
            Buat Akun
          </button>
        </form>

        <div class="auth-footer">
          <span>
            Sudah punya akun?
          </span>

          <a href="/login">
            Login
          </a>
        </div>
      </div>
    </section>
  </main>

  <script
    type="module"
    src="/javascript/register.js"
  ></script>
</body>
</html>
