<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>NexusBase</title>


</head>
<body>






<div id="nexusControls"></div><div id="nexusIcons"></div><div id="nexusHeader"></div><div id="nexusSidebar"></div><div id="nexusScrim"></div><main>
<h1 id="greeting"></h1>
<div class="hero-frame">
<div class="hero">
<p>Platform layanan digital otomatis real-time 24 jam.</p>
<div class="btns">
<a class="btn primary" href="deposit.html" id="btnDeposit">DEPOSIT</a>
<a class="btn ghost" href="transaksi.html" id="btnTransaksi">TRANSAKSI</a>
</div>
</div>
</div>
<section>
<div class="stats" id="stats">
<div class="card stat">
<small>Deposit</small>
<b id="depositValue"></b>
</div>
<div class="card stat">
<small>Aktif</small>
<b id="activeValue"></b>
</div>
<div class="card stat">
<small>Pesanan</small>
<b id="ordersValue"></b>
</div>
<div class="card stat">
<small>Selesai</small>
<b id="completedValue"></b>
</div>
</div>
</section>
<section>
<div class="card ann" id="pengumuman">
<span id="announcementTitle"></span>
<label class="link" for="annToggle">Selengkapnya →</label>
</div>
</section>
<section>
<div class="head">
<h2>Layanan</h2>
</div>
<div class="services" id="services">
</div>
</section>
<section>
<div class="head">
<h2>Pesanan Terbaru</h2>
<a class="link" href="transaksi.html" id="lihatSemua">LIHAT SEMUA</a>
</div>
<div class="card orders" id="orders">
</div>
</section>
</main>
<div class="modal" id="modalPengumuman">
<label class="modal-bg" for="annToggle"></label>
<div class="box">
<h3 id="announcementModalTitle"></h3>
<p id="announcementModalText"></p>
<label class="btn ghost" for="annToggle">Tutup</label>
</div>
</div>

<script>
const DESIGN_SOURCE="/html/desain.html";
function insertTemplate(id,html){
  const mount=document.getElementById(id);
  if(!mount)return;
  mount.outerHTML=html||"";
}
async function loadNexusDesign(){
  const response=await fetch(DESIGN_SOURCE,{cache:"no-store"});
  if(!response.ok)throw new Error("Gagal memuat desain.html");
  const source=await response.text();
  const doc=new DOMParser().parseFromString(source,"text/html");
  doc.querySelectorAll("link[rel='stylesheet'],link[href*='fonts.googleapis.com']").forEach(link=>{
    const clone=document.createElement("link");
    clone.rel=link.rel;
    clone.href=link.href;
    document.head.appendChild(clone);
  });
  doc.querySelectorAll("style").forEach(style=>{
    const clone=document.createElement("style");
    clone.textContent=style.textContent;
    document.head.appendChild(clone);
  });
  const templates={};
  doc.querySelectorAll("template").forEach(template=>templates[template.id]=template.innerHTML);
  insertTemplate("nexusControls",templates["nexus-controls"]);
  insertTemplate("nexusIcons",templates["nexus-icons"]);
  insertTemplate("nexusHeader",templates["nexus-header"]);
  insertTemplate("nexusSidebar",templates["nexus-sidebar"]);
  insertTemplate("nexusScrim",templates["nexus-scrim"]);
  const active=document.querySelector('.nav[data-n="DASHBOARD"]');
  if(active)active.classList.add("active");
  initDashboard();
}
function initDashboard(){
  const navToggle=document.getElementById("navToggle");
  const scrim=document.querySelector(".scrim");
  if(scrim) scrim.addEventListener("click",()=>{navToggle.checked=false});
  const backButton=document.getElementById("backButton");
  if(backButton) backButton.addEventListener("click",()=>{
    navToggle.checked=false;
    if(window.history.length>1){window.history.back();return}
    window.location.href="index.html";
  });
  document.querySelectorAll("aside a").forEach(link=>link.addEventListener("click",()=>{
    if(window.innerWidth<=900&&navToggle)navToggle.checked=false;
  }));
  loadDashboardData();
}
function formatMoney(value){
  return "Rp "+new Intl.NumberFormat("id-ID").format(Number(value)||0);
}
function escapeText(value){
  return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
}
function showDashboardMessage(container,message){
  if(container)container.innerHTML='<div class="empty-state" style="padding:18px;text-align:center;color:var(--muted)">'+escapeText(message)+'</div>';
}
async function loadDashboardData(){
  const servicesEl=document.getElementById("services");
  const ordersEl=document.getElementById("orders");
  try{
    const response=await fetch("/api/dashboard",{cache:"no-store",credentials:"same-origin"});
    const data=await response.json();
    if(response.status===401||response.status===403){window.location.href="/";return;}
    if(!response.ok||!data.success)throw new Error(data.error||data.message||"Data dashboard belum dapat dimuat");
    const greeting=document.getElementById("greeting");
    if(greeting)greeting.textContent=data.greeting||"Halo, User!";
    const stats=data.stats||{};
    document.getElementById("depositValue").textContent=formatMoney(stats.total_deposit);
    document.getElementById("activeValue").textContent=Number(stats.active_orders||0).toLocaleString("id-ID");
    document.getElementById("ordersValue").textContent=Number(stats.total_orders||0).toLocaleString("id-ID");
    document.getElementById("completedValue").textContent=Number(stats.completed_orders||0).toLocaleString("id-ID");
    const announcement=data.announcement||{};
    document.getElementById("announcementTitle").textContent=announcement.title||"Belum ada pengumuman";
    document.getElementById("announcementModalTitle").textContent=announcement.title||"Pengumuman NexusBase";
    document.getElementById("announcementModalText").textContent=announcement.content||"Belum ada pengumuman terbaru";
    const annLabel=document.querySelector('label[for="annToggle"]');
    if(annLabel)annLabel.addEventListener("click",()=>{document.getElementById("modalPengumuman")?.classList.toggle("show")});
    const services=Array.isArray(data.services)?data.services:[];
    if(!services.length){showDashboardMessage(servicesEl,"Katalog layanan belum tersedia");}
    else servicesEl.innerHTML=services.map(item=>{
      const type=String(item.type||"").toLowerCase();
      const href=type.includes("nokos")?"/nokos":"/suntik-sosmed";
      return '<a class="card service" href="'+href+'" style="display:block;padding:16px;text-decoration:none;color:inherit"><small>'+escapeText(item.type||"Layanan")+'</small><b style="display:block;margin:8px 0">'+escapeText(item.name||"Layanan")+'</b><span>'+formatMoney(item.price)+'</span></a>';
    }).join("");
    const orders=Array.isArray(data.recent_orders)?data.recent_orders:[];
    if(!orders.length){showDashboardMessage(ordersEl,"Belum ada pesanan terbaru");}
    else ordersEl.innerHTML=orders.map(order=>'<div class="order" style="display:flex;justify-content:space-between;gap:12px;padding:12px;border-bottom:1px solid var(--line)"><div><b>'+escapeText(order.service_name||order.order_number||"Pesanan")+'</b><small style="display:block;color:var(--muted);margin-top:4px">'+escapeText(order.order_number||("#"+order.id))+'</small></div><div style="text-align:right"><b>'+formatMoney(order.amount)+'</b><small style="display:block;color:var(--muted);margin-top:4px">'+escapeText(order.status||"PENDING")+'</small></div></div>').join("");
  }catch(error){
    showDashboardMessage(servicesEl,error.message||"Katalog layanan gagal dimuat");
    showDashboardMessage(ordersEl,"Data dashboard belum dapat dimuat. Coba login ulang atau muat ulang halaman");
    console.error("[DASHBOARD UI ERROR]",error);
  }
}
loadNexusDesign().catch(()=>{
  document.body.innerHTML='<main style="padding:40px"><div class="card"><h2>Desain gagal dimuat</h2><p class="muted">Pastikan desain.html berada di folder yang sama dengan dashboard.html</p></div></main>';
});
</script></body>
</html>
