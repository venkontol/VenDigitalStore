<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusBase - Nokos / SMS Code</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #121826;
            --card-border: #1f293d;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-red: #ef4444;
            --accent-violet: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #ef4444 0%, #8b5cf6 100%);
            --input-bg: #0f172a;
            --hover-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header / Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
            text-decoration: none;
        }

        .brand-logo svg, .brand-logo .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--accent-gradient);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .notification-bell, .menu-toggle {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            position: relative;
        }

        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent-red);
            color: white;
            font-size: 0.65rem;
            padding: 1px 4px;
            border-radius: 10px;
        }

        /* Container Main */
        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
            flex: 1;
        }

        /* Spending Chart / Stats Section */
        .spending-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .spending-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .spending-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 80px;
            gap: 4px;
            padding-top: 10px;
        }

        .chart-bar {
            flex: 1;
            background: linear-gradient(to top, rgba(239, 68, 68, 0.2), #ef4444);
            border-radius: 2px 2px 0 0;
            min-height: 4px;
            transition: height 0.3s;
        }
        .chart-bar.violet {
            background: linear-gradient(to top, rgba(139, 92, 246, 0.2), #8b5cf6);
        }

        /* Active Orders Box */
        .active-orders-section {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .section-title span.badge-count {
            background: rgba(139, 92, 246, 0.2);
            color: var(--accent-violet);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .active-order-item {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            margin-top: 8px;
        }

        .order-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .order-id {
            color: #38bdf8;
            font-weight: 600;
        }

        .order-status {
            color: #10b981;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .phone-display {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
        }

        .otp-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .order-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .btn-action {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 0.75rem;
            padding: 6px 0;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
        }
        .btn-action:hover {
            background: var(--hover-bg);
        }

        /* New Order Section */
        .new-order-container {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .filter-group {
            margin-bottom: 14px;
        }

        .filter-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        .search-box {
            position: relative;
            margin-bottom: 10px;
        }

        .search-input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px 12px 10px 36px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-violet);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Horizontal Scroll Chips (Services / Countries) */
        .chip-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .chip-scroll::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.85rem;
            color: var(--text-main);
            white-space: nowrap;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .chip.active {
            border-color: var(--accent-red);
            background: rgba(239, 68, 68, 0.1);
        }

        .grid-chips {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .grid-chip {
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .grid-chip.active {
            border-color: var(--accent-red);
            background: rgba(239, 68, 68, 0.15);
        }

        /* Products List */
        .products-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .product-card {
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .product-card:hover {
            border-color: var(--accent-violet);
        }

        .product-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .product-flag {
            font-size: 1.2rem;
        }

        .product-details .p-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .product-details .p-stock {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .product-price {
            text-align: right;
        }

        .product-price .p-cost {
            font-size: 0.95rem;
            font-weight: 700;
            color: #34d399;
        }

        /* Modal Order Confirmation */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            padding: 20px;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .modal-body {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
        }

        .btn-secondary {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--card-border);
            background-color: var(--card-bg);
        }
    </style>
</head>
<body>

    <header>
        <a href="dashboard.html" class="brand-logo">
            <div class="logo-icon">N</div>
            NexusBase
        </a>
        <div class="header-right">
            <button class="notification-bell">
                🔔
                <span class="notification-badge" id="notifCount">0</span>
            </button>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <div class="container">
        <!-- Spending Chart / Saldo info -->
        <div class="spending-card">
            <div class="spending-header">
                <span>Saldo Anda: <strong id="userBalance" style="color: #34d399;">Rp 0</strong></span>
                <span style="color: var(--text-muted); font-size: 0.75rem;" id="lastDaysLabel">Last 30 days</span>
            </div>
            <div class="spending-chart" id="spendingChartContainer">
                <div class="chart-bar" style="height: 40%;"></div>
                <div class="chart-bar violet" style="height: 70%;"></div>
                <div class="chart-bar" style="height: 30%;"></div>
                <div class="chart-bar violet" style="height: 90%;"></div>
                <div class="chart-bar" style="height: 60%;"></div>
                <div class="chart-bar violet" style="height: 80%;"></div>
            </div>
        </div>

        <!-- Active Orders Section -->
        <div class="active-orders-section" id="activeOrdersSection" style="display: none;">
            <div class="section-title">
                Active Orders <span class="badge-count" id="activeOrderCount">0</span>
            </div>
            <div id="activeOrdersList"></div>
        </div>

        <!-- New Order Main Panel -->
        <div class="new-order-container">
            <div class="section-title" style="color: var(--accent-red);">
                🔥 New Order
            </div>

            <!-- Service Filter -->
            <div class="filter-group">
                <label class="filter-label" id="serviceLabel">SERVICE (0 of 0)</label>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="serviceSearch" class="search-input" placeholder="Search services...">
                </div>
                <div class="chip-scroll" id="serviceChipsContainer">
                    <!-- Loaded dynamically from /api/nokos/services -->
                </div>
            </div>

            <!-- Country Filter -->
            <div class="filter-group">
                <label class="filter-label" id="countryLabel">COUNTRY (0)</label>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="countrySearch" class="search-input" placeholder="Search countries...">
                </div>
                <div class="grid-chips" id="countryGridContainer">
                    <!-- Loaded dynamically from /api/nokos/countries -->
                </div>
            </div>

            <!-- Products Catalogue -->
            <div class="filter-group" style="margin-bottom: 0;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label class="filter-label" id="productsLabel" style="margin-bottom: 0;">PRODUCTS (0)</label>
                    <select id="sortSelect" style="background: var(--input-bg); color: var(--text-main); border: 1px solid var(--card-border); border-radius: 6px; padding: 4px 8px; font-size: 0.75rem; outline: none;">
                        <option value="cheapest">Termurah → Termahal</option>
                        <option value="expensive">Termahal → Termurah</option>
                    </select>
                </div>
                <div class="products-list" id="productsListContainer">
                    <div style="text-align: center; color: var(--text-muted); padding: 20px; font-size: 0.85rem;">Memuat produk...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Confirmation Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <div class="modal-title">Konfirmasi Pesanan</div>
            <div class="modal-body" id="modalBodyText">
                Apakah Anda yakin ingin membeli nomor untuk layanan ini?
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCancelBtn">Batal</button>
                <button class="btn btn-primary" id="modalConfirmBtn">Create Order</button>
            </div>
        </div>
    </div>

    <footer>
        © 2026 NexusBase. All rights reserved.
    </footer>

    <!-- Integrasi sistem utama nokos.js -->
    <script src="../Javascript/nokos.js"></script>
    <script>
        // Frontend Controller Menghubungkan nokos.js ke UI Layout
        document.addEventListener("DOMContentLoaded", async () => {
            let allProducts = [];
            let allServices = [];
            let allCountries = [];
            let selectedService = '';
            let selectedCountry = '';
            let pendingOrderProduct = null;

            const productsContainer = document.getElementById('productsListContainer');
            const servicesContainer = document.getElementById('serviceChipsContainer');
            const countriesContainer = document.getElementById('countryGridContainer');
            const serviceSearch = document.getElementById('serviceSearch');
            const countrySearch = document.getElementById('countrySearch');
            const sortSelect = document.getElementById('sortSelect');

            async function loadInitialData() {
                try {
                    if (typeof NokosAPI !== 'undefined') {
                        const [prodRes, servRes, countryRes, ordersRes] = await Promise.all([
                            NokosAPI.getProducts().catch(() => []),
                            NokosAPI.getServices().catch(() => []),
                            NokosAPI.getCountries().catch(() => []),
                            NokosAPI.getOrders().catch(() => [])
                        ]);

                        allProducts = Array.isArray(prodRes) ? prodRes : (prodRes.data || []);
                        allServices = Array.isArray(servRes) ? servRes : (servRes.data || []);
                        allCountries = Array.isArray(countryRes) ? countryRes : (countryRes.data || []);

                        renderServices(allServices);
                        renderCountries(allCountries);
                        renderProducts(allProducts);
                        renderActiveOrders(Array.isArray(ordersRes) ? ordersRes : (ordersRes.data || []));
                    }
                } catch (err) {
                    console.error("Gagal memuat data NOKOS:", err);
                    productsContainer.innerHTML = `<div style="text-align: center; color: var(--accent-red); padding: 20px; font-size: 0.85rem;">Gagal memuat katalog produk. <button id="retryBtn" style="background:none; border:none; color:#38bdf8; cursor:pointer; text-decoration:underline; margin-left:5px;">Coba lagi</button></div>`;
                    document.getElementById('retryBtn')?.addEventListener('click', loadInitialData);
                }
            }

            function renderServices(services) {
                document.getElementById('serviceLabel').innerText = `SERVICE (${services.length})`;
                servicesContainer.innerHTML = services.map(s => `
                    <div class="chip ${selectedService === s.id ? 'active' : ''}" data-id="${s.id}">
                        ${s.icon ? `<img src="${s.icon}" width="16" height="16" style="border-radius:50%;">` : ''}
                        ${s.name || s.title}
                    </div>
                `).join('');

                servicesContainer.querySelectorAll('.chip').forEach(el => {
                    el.addEventListener('click', () => {
                        selectedService = selectedService === el.dataset.id ? '' : el.dataset.id;
                        renderServices(allServices);
                        filterAndRenderProducts();
                    });
                });
            }

            function renderCountries(countries) {
                document.getElementById('countryLabel').innerText = `COUNTRY (${countries.length})`;
                countriesContainer.innerHTML = countries.map(c => `
                    <div class="grid-chip ${selectedCountry === c.id ? 'active' : ''}" data-id="${c.id}">
                        <span>${c.flag || '🏳️'}</span>
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${c.name}</span>
                    </div>
                `).join('');

                countriesContainer.querySelectorAll('.grid-chip').forEach(el => {
                    el.addEventListener('click', () => {
                        selectedCountry = selectedCountry === el.dataset.id ? '' : el.dataset.id;
                        renderCountries(allCountries);
                        filterAndRenderProducts();
                    });
                });
            }

            function renderProducts(products) {
                let filtered = products.filter(p => {
                    if (selectedService && p.service_id !== selectedService && p.service !== selectedService) return false;
                    if (selectedCountry && p.country_id !== selectedCountry && p.country !== selectedCountry) return false;
                    return true;
                });

                // Sorting
                const sortVal = sortSelect.value;
                filtered.sort((a, b) => {
                    const priceA = Number(a.price || a.cost || 0);
                    const priceB = Number(b.price || b.cost || 0);
                    return sortVal === 'cheapest' ? priceA - priceB : priceB - priceA;
                });

                document.getElementById('productsLabel').innerText = `PRODUCTS (${filtered.length})`;

                if (filtered.length === 0) {
                    productsContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px; font-size: 0.85rem;">Tidak ada produk tersedia</div>`;
                    return;
                }

                productsContainer.innerHTML = filtered.map(p => `
                    <div class="product-card" data-id="${p.id || p.product_id}">
                        <div class="product-info">
                            <span class="product-flag">${p.flag || '🌐'}</span>
                            <div class="product-details">
                                <div class="p-name">${p.name || p.service_name || 'Service'}</div>
                                <div class="p-stock">${p.stock || p.count || 0} avail</div>
                            </div>
                        </div>
                        <div class="product-price">
                            <div class="p-cost">Rp ${Number(p.price || p.cost || 0).toLocaleString('id-ID')}</div>
                        </div>
                    </div>
                `).join('');

                productsContainer.querySelectorAll('.product-card').forEach((card, idx) => {
                    card.addEventListener('click', () => {
                        pendingOrderProduct = filtered[idx];
                        openModal(pendingOrderProduct);
                    });
                });
            }

            function filterAndRenderProducts() {
                renderProducts(allProducts);
            }

            function renderActiveOrders(orders) {
                const activeSec = document.getElementById('activeOrdersSection');
                const activeList = document.getElementById('activeOrdersList');
                const countBadge = document.getElementById('activeOrderCount');

                const active = orders.filter(o => o.status === 'ACTIVE' || o.status === 'active');
                if (active.length > 0) {
                    activeSec.style.display = 'block';
                    countBadge.innerText = active.length;
                    activeList.innerHTML = active.map(o => `
                        <div class="active-order-item">
                            <div class="order-meta">
                                <span class="order-id">#${o.id || o.order_id}</span>
                                <span class="order-status">${o.status}</span>
                            </div>
                            <div class="phone-display">
                                <span>${o.phone || o.number}</span>
                                <button class="copy-btn" onclick="navigator.clipboard.writeText('${o.phone || o.number}')">📋</button>
                            </div>
                            <div class="otp-status">Last detected OTP: ${o.otp || o.last_otp || 'Waiting for SMS...'}</div>
                            <div class="order-actions">
                                <button class="btn-action" onclick="finishOrder('${o.id || o.order_id}')">DONE</button>
                                <button class="btn-action" onclick="resendOrder('${o.id || o.order_id}')">RESEND</button>
                                <button class="btn-action" onclick="cancelOrder('${o.id || o.order_id}')">CANCEL</button>
                                <button class="btn-action" onclick="syncOrder('${o.id || o.order_id}')">SYNC</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    activeSec.style.display = 'none';
                }
            }

            // Modal Handling
            const modal = document.getElementById('orderModal');
            const modalBody = document.getElementById('modalBodyText');

            function openModal(prod) {
                modalBody.innerHTML = `Layanan: <b>${prod.name || prod.service_name}</b><br>Harga: <b style="color:#34d399;">Rp ${Number(prod.price || prod.cost || 0).toLocaleString('id-ID')}</b>`;
                modal.classList.add('open');
            }

            document.getElementById('modalCancelBtn').addEventListener('click', () => {
                modal.classList.remove('open');
                pendingOrderProduct = null;
            });

            document.getElementById('modalConfirmBtn').addEventListener('click', async () => {
                if (!pendingOrderProduct) return;
                modal.classList.remove('open');
                try {
                    const res = await NokosAPI.createOrder({ product_id: pendingOrderProduct.id || pendingOrderProduct.product_id });
                    if (res && (res.success || res.status === 'success' || res.id)) {
                        alert('Order berhasil dibuat!');
                        loadInitialData();
                    } else {
                        alert(res.message || 'Gagal membuat order.');
                    }
                } catch (e) {
                    alert('Terjadi kesalahan koneksi saat membuat order.');
                }
            });

            // Search listeners
            serviceSearch.addEventListener('input', (e) => {
                const val = e.target.value.toLowerCase();
                const filtered = allServices.filter(s => (s.name || s.title || '').toLowerCase().includes(val));
                renderServices(filtered);
            });

            countrySearch.addEventListener('input', (e) => {
                const val = e.target.value.toLowerCase();
                const filtered = allCountries.filter(c => (c.name || '').toLowerCase().includes(val));
                renderCountries(filtered);
            });

            sortSelect.addEventListener('change', filterAndRenderProducts);

            // Global order helper actions
            window.finishOrder = async (id) => {
                await NokosAPI.finishOrder(id);
                loadInitialData();
            };
            window.resendOrder = async (id) => {
                await NokosAPI.resendOrder(id);
                alert('Permintaan SMS ulang dikirim.');
            };
            window.cancelOrder = async (id) => {
                await NokosAPI.cancelOrder(id);
                loadInitialData();
            };
            window.syncOrder = async (id) => {
                await NokosAPI.syncOrder(id);
                loadInitialData();
            };

            loadInitialData();
        });
    </script>
</body>
</html>
