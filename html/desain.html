<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexusBase Design System</title>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>

:root{
  color-scheme:dark;
  --bg:#05050b;
  --panel:#0a0a15;
  --panel2:#10101f;
  --line:rgba(255,255,255,.07);
  --line2:rgba(255,255,255,.12);
  --text:#f2effc;
  --muted:#9793b6;
  --crimson:#d4142f;
  --crimson-hi:#f0253f;
  --violet:#6d43f0;
  --violet-hi:#a48bff;
  --edge:linear-gradient(135deg,rgba(212,20,47,.8),rgba(255,255,255,.10) 45%,rgba(109,67,240,.85));
  --hdr:62px;
  --side:250px;
  --r:16px;
}
*{
  box-sizing:border-box;
}
html{
  scroll-behavior:smooth;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Mochiy Pop One",sans-serif;
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:
    radial-gradient(700px 460px at 88% -8%,rgba(109,67,240,.20),transparent 70%),
    radial-gradient(600px 420px at 2% 104%,rgba(212,20,47,.14),transparent 70%),
    radial-gradient(900px 600px at 50% 40%,rgba(255,255,255,.015),transparent 70%);
}
button,a{
  font:inherit;
}
button{
  color:inherit;
  cursor:pointer;
}
a{
  color:inherit;
  text-decoration:none;
}
:focus-visible{
  outline:2px solid var(--violet-hi);
  outline-offset:2px;
}
.toggle{
  position:absolute;
  opacity:0;
  pointer-events:none;
}
.card{
  border-radius:var(--r);
  padding:18px 20px;
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 22px 44px -28px #000;
  transition:border-color .2s,box-shadow .2s,transform .2s;
}
.top{
  position:fixed;
  inset:0 0 auto 0;
  height:var(--hdr);
  display:grid;
  grid-template-columns:40px 1fr auto;
  align-items:center;
  padding:0 18px;
  background:rgba(5,5,11,.82);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  z-index:30;
}
.top::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(212,20,47,.7) 30%,
    rgba(109,67,240,.8) 70%,
    transparent
  );
}
.menu-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  display:grid;
  place-items:center;
  justify-self:start;
  cursor:pointer;
  background:var(--panel2);
  border:1px solid var(--line2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.menu-btn:hover{
  border-color:rgba(164,139,255,.5);
  box-shadow:0 0 22px -8px var(--violet);
}
.menu-btn span,
.menu-btn span::before,
.menu-btn span::after{
  display:block;
  width:16px;
  height:2px;
  background:var(--text);
  border-radius:2px;
  content:"";
  position:relative;
}
.menu-btn span::before{
  position:absolute;
  top:-5px;
}
.menu-btn span::after{
  position:absolute;
  top:5px;
}
.top .logo{
  opacity:1;
}
.right{
  justify-self:end;
  display:flex;
  align-items:center;
  gap:10px;
}
.bal{
  padding:8px 15px;
  border-radius:999px;
  font-size:13px;
  white-space:nowrap;
  background:var(--panel2);
  border:1px solid rgba(164,139,255,.28);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    0 0 24px -10px var(--violet);
}
.bal small{
  color:var(--muted);
  margin-right:6px;
}
.bal b{
  font-weight:700;
}
.acct{
  display:flex;
  align-items:center;
  gap:9px;
  border:0;
  background:none;
  padding:0;
}
.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:700;
  background:linear-gradient(145deg,#8a66ff,#4a2bc2);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.3),
    0 0 0 2px var(--bg),
    0 0 0 3px rgba(164,139,255,.5),
    0 0 22px -4px var(--violet);
}
.acct b{
  font-weight:500;
  font-size:13px;
}
.logo{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:800;
  font-size:17px;
  letter-spacing:.03em;
}
.logo i{
  width:36px;
  height:36px;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-style:normal;
  font-size:18px;
  color:#fff;
  background:linear-gradient(145deg,#8a66ff,#4526b8);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    0 0 0 1px rgba(255,255,255,.08),
    0 8px 26px -6px var(--violet),
    0 0 30px -12px var(--crimson);
}
.logo span{
  background:linear-gradient(180deg,#fff,#c9c1ee);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
aside{
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  width:var(--side);
  padding:0 14px 18px;
  background:linear-gradient(180deg,#07070f,#05050b);
  z-index:40;
  transition:transform .22s;
  overflow-y:auto;
}
aside::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  bottom:0;
  width:1px;
  background:linear-gradient(
    180deg,
    rgba(212,20,47,.6),
    rgba(255,255,255,.06) 45%,
    rgba(109,67,240,.6)
  );
}
#navToggle:checked ~ aside,
#navToggle:checked ~ #nexusSidebar #side{
  transform:translateX(-100%);
}
.brand{
  height:var(--hdr);
  display:flex;
  align-items:center;
  padding:0 6px;
  margin-bottom:16px;
  border-bottom:1px solid var(--line);
}
.nav-section{
  margin-bottom:18px;
}

.nav-section:last-of-type{
  margin-bottom:0;
}

.nav-label{
  display:block;
  padding:0 12px 8px;
  color:rgba(151,147,182,.62);
  font-size:9px;
  font-weight:700;
  letter-spacing:.13em;
}

.nav-section + .nav-section{
  padding-top:4px;
  border-top:1px solid rgba(255,255,255,.045);
}

.nav-return{
  margin-top:20px;
  padding-top:2px;
}

.nav-divider{
  display:block;
  height:1px;
  margin:0 6px 14px;
  background:linear-gradient(90deg,rgba(212,20,47,.55),rgba(255,255,255,.06),rgba(109,67,240,.55));
  box-shadow:0 0 14px -6px var(--violet);
}

.nav-return .back-btn{
  width:100%;
  color:var(--muted);
  background:rgba(255,255,255,.018);
}

.nav-return .back-btn:hover{
  color:#fff;
  border-color:rgba(164,139,255,.22);
  box-shadow:0 0 24px -12px var(--violet);
}

.nav{
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  padding:11px 13px;
  margin-bottom:9px;
  border-radius:13px;
  border:1px solid transparent;
  color:var(--muted);
  font-size:12.5px;
  font-weight:600;
  letter-spacing:.07em;
  transition:color .15s,background .15s,border-color .15s;
}
.nav .ic{
  width:20px;
  height:20px;
  flex:none;
}
.nav:hover{
  color:var(--text);
  background:rgba(255,255,255,.035);
  border-color:var(--line);
}
.nav.active{
  color:#fff;
  background:linear-gradient(
    90deg,
    rgba(212,20,47,.20),
    rgba(109,67,240,.10)
  );
  border-color:var(--line);
  box-shadow:
    inset 3px 0 0 var(--crimson-hi),
    0 0 34px -14px var(--crimson-hi);
}
.nav.active .ic{
  filter:drop-shadow(0 0 5px rgba(164,139,255,.7));
}
.nav-parent{
  position:relative;
}
.nav-parent > .nav{
  margin-bottom:0;
}
.nav-arrow{
  margin-left:auto;
  width:7px;
  height:7px;
  border-right:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;
  transform:rotate(45deg) translateY(-2px);
  transition:transform .2s;
}
.sosmed-open .nav-arrow{
  transform:rotate(225deg) translate(-2px,-1px);
}
.subnav{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .2s;
  overflow:hidden;
}
.sosmed-open .subnav{
  grid-template-rows:1fr;
}
.subnav-inner{
  min-height:0;
  overflow:hidden;
  padding-left:34px;
}
.subnav a{
  position:relative;
  display:flex;
  align-items:center;
  gap:9px;
  min-height:38px;
  padding:8px 11px;
  color:var(--muted);
  border-radius:10px;
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.05em;
  transition:.15s;
}
.subnav a::before{
  content:"";
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--violet-hi);
  box-shadow:0 0 8px rgba(164,139,255,.7);
}
.subnav a:hover{
  color:#fff;
  background:rgba(255,255,255,.035);
}
.subnav a.active{
  color:#fff;
  background:rgba(109,67,240,.12);
  box-shadow:inset 2px 0 0 var(--violet-hi);
}
.subnav a.active::before{
  background:var(--crimson-hi);
  box-shadow:0 0 8px rgba(240,37,63,.8);
}
.scrim{
  display:none;
}
main{
  margin-left:var(--side);
  padding:calc(var(--hdr) + 30px) 30px 60px;
  max-width:1140px;
  transition:margin .22s;
}
#navToggle:checked ~ main{
  margin-left:0;
  margin-right:auto;
}
h1{
  font-size:25px;
  font-weight:700;
  margin:0 0 20px;
  letter-spacing:-.01em;
}
h2{
  font-size:15px;
  font-weight:700;
  margin:0;
  letter-spacing:.01em;
}
section{
  margin-top:30px;
}
.hero{
  position:relative;
  isolation:isolate;
  padding:46px 38px;
  border-radius:24px;
  border:1px solid transparent;
  background:
    linear-gradient(160deg,#150a1f,#0a0a18 55%,#110912) padding-box,
    var(--edge) border-box;
  box-shadow:
    0 34px 80px -34px rgba(109,67,240,.55),
    0 0 70px -26px rgba(212,20,47,.45);
}
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  border-radius:24px;
  background:
    radial-gradient(460px 280px at 10% 0%,rgba(212,20,47,.24),transparent 70%),
    radial-gradient(460px 320px at 100% 100%,rgba(109,67,240,.30),transparent 70%);
}
.hero::after{
  content:"";
  position:absolute;
  top:0;
  left:12%;
  right:12%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
}
.hero p{
  margin:0 0 28px;
  max-width:520px;
  font-size:clamp(20px,3vw,29px);
  font-weight:700;
  line-height:1.32;
  letter-spacing:-.01em;
  text-shadow:0 0 34px rgba(164,139,255,.4);
}
.btns{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}
.btn{
  display:inline-block;
  padding:13px 28px;
  border-radius:13px;
  border:1px solid transparent;
  font-size:13px;
  font-weight:700;
  letter-spacing:.08em;
  transition:transform .15s,box-shadow .2s,border-color .2s;
}
.btn:hover{
  transform:translateY(-1px);
}
.btn.primary{
  color:#fff;
  background:linear-gradient(180deg,var(--crimson-hi),#b30f27);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.3),
    0 12px 32px -10px rgba(240,37,63,.75);
}
.btn.primary:hover{
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.3),
    0 14px 38px -8px rgba(240,37,63,.9);
}
.btn.ghost{
  background:
    linear-gradient(#100b22,#100b22) padding-box,
    linear-gradient(135deg,rgba(164,139,255,.9),rgba(109,67,240,.35)) border-box;
  box-shadow:0 0 30px -12px var(--violet);
}
.btn.ghost:hover{
  box-shadow:0 0 36px -8px var(--violet);
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}
.stat{
  position:relative;
  overflow:hidden;
}
.stat:hover{
  transform:translateY(-3px);
  border-color:rgba(164,139,255,.35);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    0 18px 40px -18px var(--violet);
}
.stat::before{
  content:"";
  position:absolute;
  left:18px;
  right:18px;
  top:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
}
.stat::after{
  content:"";
  position:absolute;
  top:18px;
  right:18px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--violet-hi);
  box-shadow:0 0 12px 2px rgba(109,67,240,.8);
}
.stat:nth-child(odd)::after{
  background:var(--crimson-hi);
  box-shadow:0 0 12px 2px rgba(212,20,47,.8);
}
.stat small{
  display:block;
  color:var(--muted);
  font-size:11.5px;
  letter-spacing:.09em;
  text-transform:uppercase;
  margin-bottom:8px;
}
.stat b{
  font-size:24px;
  font-weight:700;
  letter-spacing:-.01em;
}
.ann{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 20px;
  box-shadow:
    inset 3px 0 0 var(--crimson-hi),
    inset 0 1px 0 rgba(255,255,255,.05),
    0 0 40px -20px var(--crimson-hi);
}
.ann span{
  font-weight:600;
  display:flex;
  align-items:center;
  gap:11px;
}
.ann span::before{
  content:"";
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--crimson-hi);
  box-shadow:0 0 12px 2px rgba(240,37,63,.75);
}
.link{
  background:none;
  border:0;
  color:var(--violet-hi);
  font-size:13px;
  font-weight:600;
  padding:4px 0;
  white-space:nowrap;
  cursor:pointer;
  transition:color .15s;
}
.link:hover{
  color:#fff;
}
.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.services{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.svc{
  display:flex;
  align-items:center;
  gap:16px;
  width:100%;
  padding:20px;
  font-weight:700;
  letter-spacing:.06em;
  font-size:13px;
}
.svc:hover{
  transform:translateY(-3px);
  border-color:rgba(164,139,255,.35);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    0 20px 44px -20px var(--violet);
}
.tile{
  width:48px;
  height:48px;
  border-radius:15px;
  display:grid;
  place-items:center;
  flex:none;
}
.tile svg{
  width:27px;
  height:27px;
}
.t-tt{
  background:linear-gradient(145deg,#15151d,#050508);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:
    0 0 26px -6px rgba(34,211,238,.45),
    0 0 22px -8px rgba(255,36,64,.55);
}
.t-wa{
  background:linear-gradient(
    145deg,
    rgba(37,211,102,.18),
    rgba(37,211,102,.05)
  );
  border:1px solid rgba(37,211,102,.35);
  box-shadow:0 0 28px -6px rgba(37,211,102,.55);
}
.t-server{
  background:linear-gradient(
    145deg,
    rgba(109,67,240,.24),
    rgba(109,67,240,.06)
  );
  border:1px solid rgba(164,139,255,.32);
  box-shadow:0 0 28px -7px rgba(109,67,240,.65);
}
.svc em{
  margin-left:auto;
  font-style:normal;
  color:var(--muted);
  transition:transform .2s,color .2s;
}
.svc:hover em{
  transform:translateX(3px);
  color:#fff;
}
.orders{
  padding:0;
  overflow:hidden;
}
.row{
  display:grid;
  grid-template-columns:1.1fr 1.4fr 1.2fr auto;
  gap:12px;
  align-items:center;
  padding:16px 22px;
  border-bottom:1px solid var(--line);
  transition:background .15s;
}
.row:hover{
  background:rgba(255,255,255,.025);
}
.row:last-child{
  border-bottom:0;
}
.row .id{
  font-weight:700;
}
.row .muted{
  color:var(--muted);
  font-size:13px;
}
.tag{
  padding:4px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  justify-self:end;
  border:1px solid transparent;
}
.tag.ok{
  background:rgba(109,67,240,.16);
  color:#cfc4ff;
  border-color:rgba(164,139,255,.3);
  box-shadow:0 0 16px -6px var(--violet);
}
.tag.wait{
  background:rgba(255,255,255,.05);
  color:var(--muted);
  border-color:var(--line2);
}
.tag.fail{
  background:rgba(212,20,47,.15);
  color:#ff98a3;
  border-color:rgba(240,37,63,.35);
  box-shadow:0 0 16px -6px var(--crimson-hi);
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:60;
  place-items:center;
  padding:16px;
}
#annToggle:checked ~ .modal{
  display:grid;
}
.modal-bg{
  position:absolute;
  inset:0;
  background:rgba(2,2,6,.78);
  backdrop-filter:blur(4px);
  cursor:pointer;
}
.box{
  position:relative;
  max-width:430px;
  width:100%;
  padding:28px;
  border-radius:20px;
  border:1px solid transparent;
  background:
    linear-gradient(160deg,#12102a,#0a0a15) padding-box,
    var(--edge) border-box;
  box-shadow:
    0 30px 80px -20px #000,
    0 0 60px -24px var(--violet);
}
.box h3{
  margin:0 0 8px;
  font-size:17px;
}
.box p{
  margin:0 0 22px;
  color:var(--muted);
}
.box label{
  cursor:pointer;
}
@media(max-width:900px){
  aside{
    transform:translateX(-100%);
  }
  #navToggle:checked ~ aside,
  #navToggle:checked ~ #nexusSidebar #side{
    transform:none;
  }
  main,
  #navToggle:checked ~ main{
    margin-left:0;
    padding:calc(var(--hdr) + 22px) 16px 44px;
  }
  .top > div:first-of-type{
    min-width:40px;
  }
  #navToggle:checked ~ .scrim{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(2,2,6,.7);
    z-index:35;
  }
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
  .services{
    grid-template-columns:1fr;
  }
  .acct b,
  .bal small{
    display:none;
  }
  .row{
    grid-template-columns:1fr auto;
    row-gap:2px;
    padding:14px 18px;
  }
  .row .tag{
    grid-row:1;
    grid-column:2;
  }
  .hero{
    padding:32px 22px;
  }
}
@media(max-width:520px){
  .top{
    padding:0 12px;
  }
  .right{
    gap:7px;
  }
  .bal{
    padding:7px 11px;
    font-size:11px;
  }
  .avatar{
    width:35px;
    height:35px;
  }
  h1{
    font-size:22px;
  }
  .hero p{
    font-size:21px;
  }
  .btn{
    width:100%;
    text-align:center;
  }
  .stats{
    gap:10px;
  }
  .stat{
    padding:15px;
  }
  .stat b{
    font-size:19px;
  }
  .ann{
    align-items:flex-start;
    flex-direction:column;
  }
}
body{overflow-x:hidden}

body::before{
  background:
    radial-gradient(700px 460px at 88% -8%,rgba(109,67,240,.26),transparent 70%),
    radial-gradient(600px 420px at 2% 104%,rgba(212,20,47,.20),transparent 70%),
    radial-gradient(520px 380px at 0% 22%,rgba(212,20,47,.10),transparent 70%),
    radial-gradient(560px 380px at 100% 78%,rgba(109,67,240,.14),transparent 70%),
    radial-gradient(900px 600px at 50% 40%,rgba(255,255,255,.015),transparent 70%);
}

h1{text-shadow:0 0 26px rgba(109,67,240,.45)}
h2{text-shadow:0 0 18px rgba(164,139,255,.35)}

.top::after{box-shadow:0 0 14px 1px rgba(109,67,240,.55),0 0 22px 2px rgba(212,20,47,.35)}
aside::after{box-shadow:0 0 14px 1px rgba(212,20,47,.45),0 0 18px 1px rgba(109,67,240,.4)}
.hero::after{box-shadow:0 0 14px rgba(255,255,255,.22)}

.menu-btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 18px -6px var(--violet),0 0 14px -8px var(--crimson)}
.bal{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 24px -8px var(--violet),0 0 18px -10px var(--crimson)}
.avatar{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 2px var(--bg),0 0 0 3px rgba(164,139,255,.5),0 0 22px -4px var(--violet),0 0 18px -6px var(--crimson)}

.nav.active{box-shadow:inset 3px 0 0 var(--crimson-hi),0 0 34px -14px var(--crimson-hi),8px 0 30px -16px var(--violet)}

.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 22px 44px -28px #000,-10px 0 28px -20px rgba(212,20,47,.55),10px 0 28px -20px rgba(109,67,240,.6)}
.ann{box-shadow:inset 3px 0 0 var(--crimson-hi),inset 0 1px 0 rgba(255,255,255,.05),0 0 40px -20px var(--crimson-hi),12px 0 30px -18px var(--violet)}

.btn.primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 12px 32px -10px rgba(240,37,63,.75),0 0 26px -6px rgba(240,37,63,.5)}
.btn.ghost{box-shadow:0 0 30px -10px var(--violet),0 0 20px -10px var(--crimson)}
.t-server{box-shadow:0 0 28px -7px rgba(109,67,240,.75),0 0 18px -8px rgba(212,20,47,.4)}

.hero-frame{
  position:relative;
  z-index:1;
  padding:2px;
  border-radius:26px;
  background:conic-gradient(from 200deg,rgba(212,20,47,.95),rgba(255,255,255,.22) 22%,rgba(109,67,240,.98) 45%,rgba(255,255,255,.22) 70%,rgba(212,20,47,.95));
  box-shadow:0 0 34px -8px rgba(109,67,240,.55),0 0 40px -10px rgba(212,20,47,.5);
}
.hero-frame::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  border-radius:inherit;
  background:conic-gradient(from 200deg,rgba(212,20,47,.95),rgba(255,255,255,.22) 22%,rgba(109,67,240,.98) 45%,rgba(255,255,255,.22) 70%,rgba(212,20,47,.95));
  filter:blur(22px);
  opacity:.5;
}
.hero{
  border:0;
  border-radius:24px;
  background:linear-gradient(160deg,#150a1f,#0a0a18 55%,#110912);
  box-shadow:none;
}

.box{
  border:0;
  isolation:isolate;
  background:conic-gradient(from 200deg,rgba(212,20,47,.95),rgba(255,255,255,.22) 22%,rgba(109,67,240,.98) 45%,rgba(255,255,255,.22) 70%,rgba(212,20,47,.95));
  box-shadow:0 30px 80px -20px #000,0 0 44px -10px rgba(212,20,47,.5),0 0 60px -14px rgba(109,67,240,.6);
}
.box::before{
  content:"";
  position:absolute;
  inset:2px;
  z-index:-1;
  border-radius:18px;
  background:linear-gradient(160deg,#12102a,#0a0a15);
}

.logo{gap:14px}
.logo i{
  position:relative;
  isolation:isolate;
  flex:none;
  width:40px;
  height:40px;
  border:0;
  border-radius:13px;
  font-size:19px;
  font-weight:800;
  color:#f4f0ff;
  text-shadow:0 0 12px rgba(164,139,255,.9),0 0 2px rgba(255,255,255,.6);
  background:conic-gradient(from 200deg,rgba(212,20,47,.95),rgba(255,255,255,.22) 22%,rgba(109,67,240,.98) 45%,rgba(255,255,255,.22) 70%,rgba(212,20,47,.95));
  box-shadow:
    -6px 5px 22px -8px rgba(212,20,47,.7),
    6px -4px 22px -8px rgba(109,67,240,.8),
    0 10px 24px -12px #000;
}
.logo i::before{
  content:"";
  position:absolute;
  inset:2px;
  z-index:-1;
  border-radius:11px;
  background:linear-gradient(145deg,#1d1438,#09070f);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -8px 14px -8px rgba(109,67,240,.5);
}
.logo i::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 48%,transparent 62%);
}
.logo span{
  position:relative;
  display:inline-flex;
  align-items:baseline;
  gap:.22em;
  font-size:16px;
  letter-spacing:.2em;
  text-transform:uppercase;
  background:none;
  -webkit-background-clip:border-box;
  background-clip:border-box;
  color:inherit;
}
.logo span::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-8px;
  height:1px;
  background:linear-gradient(90deg,rgba(240,37,63,.9),rgba(164,139,255,.9),transparent);
  box-shadow:0 0 10px rgba(164,139,255,.5);
}
.logo b{
  font-weight:800;
  background:linear-gradient(100deg,#9d97b8,#fff 30%,#d8cfff 55%,#fff 80%,#9d97b8);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 8px rgba(164,139,255,.45));
}
.logo em{
  font-style:normal;
  font-weight:500;
  background:linear-gradient(90deg,#f0253f,#a48bff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 8px rgba(240,37,63,.5));
}

@media(max-width:520px){
  .hero-frame{border-radius:22px}
  .hero{border-radius:20px}
  .hero-frame::before{filter:blur(16px)}
  .logo span{font-size:14.5px;letter-spacing:.16em}
}

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    transition:none!important;
    scroll-behavior:auto!important;
  }
}

.logo span{
  background:linear-gradient(90deg,#f0253f,#a48bff,#f0253f);
  background-size:220% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:nexusGradient 7s ease-in-out infinite;
}
@keyframes nexusGradient{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.top .logo span,.brand .logo span{
  font-family:"Mochiy Pop One",sans-serif;
}
@media(prefers-reduced-motion:reduce){
  .logo span{animation:none}
}
